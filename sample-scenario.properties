# =====================================================================
# URSC LEO Trajectory Predictor - sample scenario
# Every line below is a knob: comment it out to use the default, or
# change the value. Run with:
#   java -cp target/classes org.ursc.trajectory.app.PropagatorApp sample-scenario.properties
# =====================================================================

# ---- epoch (UTC) ----
epoch = 2024-01-01T00:00:00

# ---- initial orbit ----
# type = keplerian | cartesian
orbit.type       = keplerian
# give either orbit.a (m) or orbit.altitude (m above equatorial radius)
orbit.altitude   = 600000
orbit.e          = 0.001
orbit.i          = 51.6
orbit.raan       = 30.0
orbit.pa         = 0.0
orbit.anomaly    = 0.0
orbit.anomaly.type = MEAN
# For a cartesian start instead, set:
# orbit.type     = cartesian
# orbit.position = 6978137.0, 0.0, 0.0
# orbit.velocity = 0.0, 7557.0, 1000.0

# ---- spacecraft physical properties ----
spacecraft.mass                = 500.0
spacecraft.dragArea            = 2.0
spacecraft.dragCoefficient     = 2.2
spacecraft.srpArea             = 2.0
spacecraft.reflectionCoefficient = 1.5

# ---- force models (toggle each independently) ----
force.gravity          = true
# gravity.model = egm96 (bundled EGM96, d/o up to 70) | zonal (J2..J6 only)
gravity.model          = egm96
gravity.degree         = 20
gravity.order          = 20
# gravity.file         = /path/to/EGM96.gfc   # external normalized C,S overrides the bundled field
gravity.mu             = 3.986004418e14
gravity.radius         = 6378136.3

force.thirdBody.sun    = true
force.thirdBody.moon   = true

force.drag             = true
# drag.model = exponential | harris-priester | nrlmsise00
drag.model             = nrlmsise00
drag.harrisPriester.exponent = 4.0
# solar/geomagnetic activity for nrlmsise00 (constant over the run)
spaceWeather.f107      = 150.0
spaceWeather.f107a     = 150.0
spaceWeather.ap        = 4.0

force.srp              = true

# solid Earth tides (Sun + Moon, IERS-2010)
force.solidTides       = true

# ocean tides (bundled FES2004 8-constituent truncation, d/o 4)
force.oceanTides       = true

# Earth albedo + infrared radiation pressure (Knocke-Ries); uses srp Cr/area
force.earthRadiation   = true

force.relativity       = false
# add the Lense-Thirring frame-dragging term when relativity is on
force.relativity.lenseThirring = false

force.empirical        = false
empirical.radial       = 0.0
empirical.transverse   = 0.0
empirical.normal       = 0.0

# ---- integrator ----
# integrator.type = dp54 | rk4
integrator.type        = dp54
integrator.initialStep = 60.0
integrator.minStep     = 1.0e-3
integrator.maxStep     = 300.0
integrator.absTol      = 1.0e-6
integrator.relTol      = 1.0e-9

# ---- propagation span ----
# give either propagation.duration (s) or propagation.end (UTC date)
propagation.duration   = 86400

# ---- output ----
# output.type = keplerian | cartesian | equinoctial
output.type            = keplerian
output.step            = 60.0
output.file            = ephemeris.csv

# ---- optional events ----
# stop propagation when geodetic altitude drops to this value (m) -> re-entry
# event.reentryAltitude = 120000
