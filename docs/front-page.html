<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Internship Report — Front Page</title>
<style>
  @page { size: A4; margin: 0; }
  :root { --ink:#16222e; --muted:#5a6b7d; --line:#d4dde7; --primary:#0b3d6e; --accent:#1d6fd1; --accent2:#0d7a74; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { font-family: "Segoe UI", system-ui, "Helvetica Neue", sans-serif; color: var(--ink); }
  .page { width: 210mm; height: 297mm; padding: 22mm 20mm; display: flex; flex-direction: column;
          border: 0; position: relative; }
  .frame { position: absolute; inset: 10mm; border: 2px solid var(--primary); border-radius: 4px; }
  .frame::after { content: ""; position: absolute; inset: 3mm; border: 1px solid var(--line); }
  .top { text-align: center; margin-top: 18mm; }
  .heading { font-size: 34px; font-weight: 800; letter-spacing: 6px; color: var(--primary); margin: 0; }
  .org { font-size: 22px; font-weight: 600; letter-spacing: 3px; color: var(--accent2); margin: 10px 0 0; }
  .rule { width: 60%; height: 3px; background: var(--accent); margin: 26mm auto 0; border-radius: 2px; }
  .title-block { text-align: center; margin-top: 16mm; }
  .label { font-size: 13px; text-transform: uppercase; letter-spacing: 3px; color: var(--muted); margin: 0 0 8px; }
  .title { font-size: 30px; line-height: 1.3; font-weight: 700; color: var(--primary); margin: 0 10mm; }
  .rule2 { width: 60%; height: 3px; background: var(--accent); margin: 16mm auto 0; border-radius: 2px; }
  .people { margin-top: auto; margin-bottom: 14mm; display: flex; justify-content: space-between; padding: 0 8mm; }
  .person { width: 46%; }
  .person.right { text-align: right; }
  .person .label { margin-bottom: 10px; }
  .name { font-size: 22px; font-weight: 700; color: var(--ink); margin: 0 0 4px; }
  .role { font-size: 16px; color: var(--ink); margin: 0; line-height: 1.5; }
</style>
</head>
<body>
<div class="page">
  <div class="frame"></div>
  <div class="top">
    <p class="heading">INTERNSHIP REPORT</p>
    <p class="org">ISRO URSC 2026</p>
  </div>
  <div class="rule"></div>
  <div class="title-block">
    <p class="label">Project title</p>
    <p class="title">GNSS Based Orbit Determination and Trajectory Prediction</p>
  </div>
  <div class="rule2"></div>
  <div class="people">
    <div class="person">
      <p class="label">Presented to</p>
      <p class="name">Thameemunisha M</p>
      <p class="role"><b>Guide, ISRO URSC</b></p>
    </div>
    <div class="person right">
      <p class="label">Presented by</p>
      <p class="name">Dhavan M</p>
      <p class="role"><b>Intern</b></p>
    </div>
  </div>
</div>
</body>
</html>
