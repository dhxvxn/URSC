<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNSS Orbit Determination &amp; Trajectory Prediction</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">GNSS <span>orbit determination &amp; trajectory prediction</span></div>
  <nav id="tabs" class="tabs">
    <button data-tab="data" class="active">Data</button>
    <button data-tab="run">Run</button>
    <button data-tab="results">Results</button>
    <button data-tab="window">Window</button>
    <button data-tab="history">History</button>
    <button data-tab="help">Help</button>
  </nav>
  <form id="quick-search" class="quick-search" autocomplete="off">
    <input id="quick-search-q" type="search" placeholder="Search help and settings…" aria-label="Search help">
  </form>
  <div id="job" class="job hidden"><div class="job-bar"><div></div></div><span class="job-text"></span></div>
  <a id="guide" class="guide-link" href="guide/" target="_blank" rel="noopener" title="Open the feature guide in a new tab">Guide</a>
  <button id="theme" class="icon-btn" title="Toggle light/dark">◐</button>
  <button id="quit" class="icon-btn" title="Stop the server">⏻</button>
</header>
<main>
  <section id="tab-data" class="tab active"></section>
  <section id="tab-run" class="tab"></section>
  <section id="tab-results" class="tab"></section>
  <section id="tab-window" class="tab"></section>
  <section id="tab-history" class="tab"></section>
  <section id="tab-help" class="tab"></section>
</main>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
